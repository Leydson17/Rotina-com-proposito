<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Devocional Diário</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{background:#0d0d0d;color:#e8e8e0;font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}

    .header{background:linear-gradient(135deg,#1a0a2e,#0d1b2a);border-bottom:1px solid #2a1a3e;padding:calc(env(safe-area-inset-top)+20px) 24px 16px;text-align:center}
    .header-label{font-size:10px;letter-spacing:4px;color:#c084fc;text-transform:uppercase;margin-bottom:6px}
    .header h1{font-size:22px;font-weight:normal;color:#f0ece0}
    .header-date{font-size:12px;color:#888;margin-top:4px;font-style:italic}

    .tabs{display:flex;border-bottom:1px solid #2a2a3e;background:#0d0d0d}
    .tab-btn{flex:1;padding:11px 4px;background:transparent;border:none;color:#555;font-size:10px;letter-spacing:.5px;cursor:pointer;font-family:Georgia,serif;border-bottom:2px solid transparent;transition:all .2s}
    .tab-btn.active{color:#c084fc;border-bottom-color:#c084fc}

    .view{display:none}
    .view.active{display:block}

    /* HOJE */
    .today-view{padding:16px}

    .verse-card{background:linear-gradient(135deg,#1a0a2e,#2a1040);border:1px solid #c084fc33;border-radius:14px;padding:20px;margin-bottom:16px;position:relative}
    .verse-label{font-size:9px;color:#c084fc;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px}
    .verse-text{font-size:16px;color:#f0ece0;line-height:1.8;font-style:italic;margin-bottom:12px}
    .verse-ref{font-size:12px;color:#c084fc;text-align:right}
    .verse-nav{display:flex;justify-content:space-between;margin-top:12px}
    .verse-nav-btn{background:transparent;border:1px solid #2a1a3e;border-radius:20px;color:#888;font-size:11px;padding:5px 12px;cursor:pointer;font-family:Georgia,serif}

    .section-title{font-size:10px;color:#555;letter-spacing:2px;margin-bottom:10px}

    .reflection-card{background:#1a1a2e;border:1px solid #2a2a3e;border-radius:10px;padding:14px;margin-bottom:10px}
    .reflection-q{font-size:13px;color:#e8e8e0;line-height:1.6;margin-bottom:10px}
    .reflection-num{font-size:10px;color:#c084fc;letter-spacing:1px;margin-bottom:6px}

    .journal-area{width:100%;min-height:80px;background:#0d0d0d;border:1px solid #2a2a3e;border-radius:8px;color:#b0c4d8;font-size:13px;font-family:Georgia,serif;padding:10px 12px;resize:none;outline:none;line-height:1.6}
    .journal-area:focus{border-color:#c084fc44}
    .save-btn{width:100%;margin-top:8px;padding:11px;background:#c084fc22;border:1px solid #c084fc44;border-radius:8px;color:#c084fc;font-size:12px;font-family:Georgia,serif;cursor:pointer;letter-spacing:1px}
    .saved-badge{font-size:10px;color:#4ecb71;margin-top:6px;text-align:center;display:none}

    .prayer-card{background:#1a0a2e;border:1px solid #c084fc22;border-radius:10px;padding:14px;margin-top:16px;margin-bottom:16px}
    .prayer-label{font-size:9px;color:#c084fc;letter-spacing:3px;margin-bottom:10px}
    .prayer-text{font-size:13px;color:#b0c4d8;line-height:1.8;font-style:italic}

    .complete-btn{width:100%;padding:14px;background:linear-gradient(90deg,#4a2c6e,#6a3a9e);border:none;border-radius:10px;color:#e8e8e0;font-size:14px;font-family:Georgia,serif;cursor:pointer;margin-bottom:20px;letter-spacing:1px}
    .complete-btn.done{background:#1a4731;border:1px solid #4ecb7144;color:#4ecb71}

    /* HISTÓRICO */
    .history-view{padding:16px}
    .history-empty{text-align:center;color:#555;font-size:13px;font-style:italic;padding:40px 20px}
    .history-item{background:#1a1a2e;border:1px solid #2a2a3e;border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer}
    .history-item-date{font-size:10px;color:#c084fc;letter-spacing:1px;margin-bottom:6px}
    .history-item-verse{font-size:12px;color:#888;font-style:italic;margin-bottom:6px}
    .history-item-note{font-size:12px;color:#aaa;line-height:1.5}
    .history-done{font-size:10px;color:#4ecb71;margin-top:6px}
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">COMUNHÃO DIÁRIA</div>
  <h1>✝️ Devocional</h1>
  <div class="header-date" id="headerDate"></div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('hoje',0)">📖 HOJE</button>
  <button class="tab-btn" onclick="switchTab('historico',1)">📅 HISTÓRICO</button>
</div>

<div class="view active" id="view-hoje">
  <div class="today-view">

    <!-- VERSÍCULO -->
    <div class="verse-card">
      <div class="verse-label">✦ VERSÍCULO DO DIA ✦</div>
      <div class="verse-text" id="verseText"></div>
      <div class="verse-ref" id="verseRef"></div>
      <div class="verse-nav">
        <button class="verse-nav-btn" onclick="prevVerse()">← anterior</button>
        <button class="verse-nav-btn" onclick="nextVerse()">próximo →</button>
      </div>
    </div>

    <!-- REFLEXÃO -->
    <div class="section-title">REFLEXÃO GUIADA</div>

    <div class="reflection-card">
      <div class="reflection-num">PERGUNTA 1 — OBSERVAÇÃO</div>
      <div class="reflection-q" id="q1"></div>
      <textarea class="journal-area" id="ans1" placeholder="Escreva sua reflexão aqui..." rows="3"></textarea>
    </div>

    <div class="reflection-card">
      <div class="reflection-num">PERGUNTA 2 — INTERPRETAÇÃO</div>
      <div class="reflection-q" id="q2"></div>
      <textarea class="journal-area" id="ans2" placeholder="Escreva sua reflexão aqui..." rows="3"></textarea>
    </div>

    <div class="reflection-card">
      <div class="reflection-num">PERGUNTA 3 — APLICAÇÃO</div>
      <div class="reflection-q" id="q3"></div>
      <textarea class="journal-area" id="ans3" placeholder="Escreva sua reflexão aqui..." rows="3"></textarea>
    </div>

    <button class="save-btn" onclick="saveReflections()">💾 Salvar reflexões</button>
    <div class="saved-badge" id="savedBadge">✓ Reflexões salvas!</div>

    <!-- ORAÇÃO -->
    <div class="prayer-card">
      <div class="prayer-label">🙏 ORAÇÃO DO DIA</div>
      <div class="prayer-text" id="prayerText"></div>
    </div>

    <!-- CONCLUIR -->
    <button class="complete-btn" id="completeBtn" onclick="toggleComplete()">
      Marcar devocional como concluído ✓
    </button>

  </div>
</div>

<div class="view" id="view-historico">
  <div class="history-view" id="historyList"></div>
</div>

<script>
const VERSES = [
  {text:'"Porque sou eu que conheço os planos que tenho a vosso respeito, planos de paz e não de calamidade, para vos dar um futuro e uma esperança."',ref:'Jeremias 29:11',q1:'O que Deus está prometendo neste versículo?',q2:'Por que essa promessa foi dada ao povo de Israel no exílio?',q3:'Como essa promessa me afeta hoje no meu dia a dia?',prayer:'Senhor, confio que Teus planos para mim são bons. Quando eu não entendo o caminho, ajuda-me a descansar na Tua promessa. Que eu busque meu futuro em Ti, não nas circunstâncias. Amém.'},
  {text:'"Tudo posso naquele que me fortalece."',ref:'Filipenses 4:13',q1:'O que Paulo quis dizer com "tudo posso"?',q2:'Em que contexto Paulo escreveu isso — ele estava bem ou passando por dificuldades?',q3:'Qual desafio da minha vida precisa desta verdade hoje?',prayer:'Pai, reconheço que minha força é limitada, mas a Tua é infinita. Fortifica-me hoje para cumprir o que me chamaste a fazer. Que eu dependa de Ti em tudo. Amém.'},
  {text:'"Buscai primeiro o reino de Deus e a sua justiça, e todas as demais coisas vos serão acrescentadas."',ref:'Mateus 6:33',q1:'O que significa buscar "primeiro" o reino de Deus?',q2:'Por que Jesus deu essa instrução logo após falar sobre ansiedade?',q3:'Minhas prioridades do dia refletem que estou buscando primeiro a Deus?',prayer:'Senhor Jesus, ajuda-me a colocar-Te em primeiro lugar — antes do trabalho, antes das preocupações. Que meu dia comece e termine em Ti. Amém.'},
  {text:'"O Senhor é o meu pastor; nada me faltará."',ref:'Salmos 23:1',q1:'O que a imagem do pastor comunica sobre Deus?',q2:'Quais outros elementos do Salmo 23 complementam esse versículo?',q3:'Em que área da minha vida preciso confiar que nada me faltará?',prayer:'Senhor, Tu és meu pastor fiel. Mesmo quando passo por vales sombrios, Tu estás comigo. Que eu ouça Tua voz e te siga sem medo. Amém.'},
  {text:'"Sede fortes e corajosos. Não temais, nem vos assusteis diante deles, porque o Senhor, teu Deus, é quem vai contigo."',ref:'Deuteronômio 31:6',q1:'Para quem Deus disse essas palavras originalmente?',q2:'Qual é a base para a coragem que Deus ordena?',q3:'Que situação em minha vida exige coragem que só Deus pode dar?',prayer:'Deus forte, enche-me de coragem hoje. Que o medo não paralise meus passos. Sei que não estou sozinho — Tu vais à minha frente. Amém.'},
  {text:'"Não vos conformeis com este século, mas transformai-vos pela renovação da vossa mente."',ref:'Romanos 12:2',q1:'O que Paulo quer dizer com "não vos conformeis"?',q2:'Como a mente renovada leva ao discernimento da vontade de Deus?',q3:'Qual padrão do mundo ainda molda meu pensamento que preciso entregar a Deus?',prayer:'Pai, renova minha mente. Que Tua Palavra transforme o modo como vejo o trabalho, a família e as decisões. Não deixa o mundo me moldar. Amém.'},
  {text:'"O amor é paciente, o amor é bondoso. Não inveja, não se vangloria, não se orgulha."',ref:'1 Coríntios 13:4',q1:'Quais características do amor são mencionadas neste versículo?',q2:'Por que Paulo colocou o amor acima de todos os dons espirituais?',q3:'Qual característica do amor preciso desenvolver mais nas minhas relações?',prayer:'Senhor, ensina-me a amar como Tu amas — paciente, bondoso, sem vaidade. Que meu amor pela minha família reflita o Teu amor por mim. Amém.'},
  {text:'"Confia no Senhor de todo o teu coração e não te estribes no teu próprio entendimento."',ref:'Provérbios 3:5',q1:'O que significa confiar com "todo o coração"?',q2:'Por que nosso próprio entendimento pode ser um obstáculo?',q3:'Há alguma decisão que estou tentando resolver sozinho em vez de confiar a Deus?',prayer:'Senhor, entrego meu entendimento limitado a Ti. Quando não souber o caminho, guia meus passos. Confio em Ti com tudo o que sou. Amém.'},
  {text:'"Mas os que esperam no Senhor renovarão as suas forças, subirão com asas como águias."',ref:'Isaías 40:31',q1:'O que a imagem das águias comunica sobre os que esperam em Deus?',q2:'Por que "esperar no Senhor" exige força de caráter?',q3:'Há algo em minha vida onde preciso aprender a esperar com paciência?',prayer:'Pai, quando estou cansado e sem forças, renova-me. Ensina-me a esperar em Ti com esperança, não com ansiedade. Amém.'},
  {text:'"E tudo quanto fizerdes, fazei-o de todo o coração, como ao Senhor, e não aos homens."',ref:'Colossenses 3:23',q1:'O que significa fazer algo "como ao Senhor"?',q2:'Como essa perspectiva muda a motivação para o trabalho?',q3:'Como posso aplicar esse princípio ao meu trabalho hoje?',prayer:'Senhor, que tudo o que eu fizer hoje — no trabalho, em casa, nos estudos — seja feito para a Tua glória. Amém.'},
  {text:'"Instrui o menino no caminho em que deve andar; e até quando envelhecer não se desviará dele."',ref:'Provérbios 22:6',q1:'Que responsabilidade esse versículo coloca sobre os pais?',q2:'O que significa "o caminho em que deve andar" — é genérico ou personalizado?',q3:'O que estou ensinando ao meu filho pelo meu exemplo diário?',prayer:'Pai, ajuda-me a ser um pai que instrui com amor e consistência. Que meu filho veja Cristo em mim. Amém.'},
  {text:'"Porque Deus amou o mundo de tal maneira que deu o seu Filho unigênito, para que todo aquele que nele crê não pereça, mas tenha a vida eterna."',ref:'João 3:16',q1:'Quais são as dimensões do amor de Deus reveladas neste versículo?',q2:'O que significa que Deus "deu" seu filho?',q3:'Esse amor de Deus tem mudado a forma como eu me relaciono com as pessoas?',prayer:'Senhor, que eu nunca perca de vista o quanto me amaste. Que esse amor seja a base de tudo que faço. Amém.'},
];

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDate(key) {
  const [y,m,d] = key.split('-');
  const months = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return `${d} de ${months[parseInt(m)-1]} de ${y}`;
}

// State
let devData = JSON.parse(localStorage.getItem('devocional') || '{}');
let verseOffset = 0;

function getTodayVerseIdx() {
  const d = new Date();
  return (d.getFullYear() * 365 + d.getMonth() * 31 + d.getDate() + verseOffset) % VERSES.length;
}

function save() { localStorage.setItem('devocional', JSON.stringify(devData)); }

function switchTab(tab, idx) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
  document.querySelectorAll('.tab-btn')[idx].classList.add('active');
  if (tab === 'historico') renderHistory();
}

function prevVerse() { verseOffset--; renderToday(); }
function nextVerse() { verseOffset++; renderToday(); }

function renderToday() {
  const key = todayKey();
  const vi = getTodayVerseIdx();
  const v = VERSES[vi];
  const stored = devData[key] || {};

  // Header date
  document.getElementById('headerDate').textContent = formatDate(key);

  // Verse
  document.getElementById('verseText').textContent = v.text;
  document.getElementById('verseRef').textContent = '— ' + v.ref;

  // Questions
  document.getElementById('q1').textContent = v.q1;
  document.getElementById('q2').textContent = v.q2;
  document.getElementById('q3').textContent = v.q3;

  // Answers
  document.getElementById('ans1').value = stored.ans1 || '';
  document.getElementById('ans2').value = stored.ans2 || '';
  document.getElementById('ans3').value = stored.ans3 || '';

  // Prayer
  document.getElementById('prayerText').textContent = v.prayer;

  // Complete btn
  const btn = document.getElementById('completeBtn');
  if (stored.done) {
    btn.textContent = '✅ Devocional concluído!';
    btn.classList.add('done');
  } else {
    btn.textContent = 'Marcar devocional como concluído ✓';
    btn.classList.remove('done');
  }

  // Saved badge
  document.getElementById('savedBadge').style.display = stored.ans1 ? 'block' : 'none';
}

function saveReflections() {
  const key = todayKey();
  const vi = getTodayVerseIdx();
  if (!devData[key]) devData[key] = {};
  devData[key].verseIdx = vi;
  devData[key].verseRef = VERSES[vi].ref;
  devData[key].ans1 = document.getElementById('ans1').value;
  devData[key].ans2 = document.getElementById('ans2').value;
  devData[key].ans3 = document.getElementById('ans3').value;
  save();
  const badge = document.getElementById('savedBadge');
  badge.style.display = 'block';
  setTimeout(() => badge.style.display = 'none', 2000);
}

function toggleComplete() {
  const key = todayKey();
  const vi = getTodayVerseIdx();
  if (!devData[key]) devData[key] = {};
  devData[key].verseIdx = vi;
  devData[key].verseRef = VERSES[vi].ref;
  devData[key].done = !devData[key].done;
  save();
  renderToday();
}

function renderHistory() {
  const el = document.getElementById('historyList');
  const keys = Object.keys(devData).sort().reverse();
  if (!keys.length) {
    el.innerHTML = '<div class="history-empty">Nenhum devocional registrado ainda.<br>Complete o de hoje para começar seu histórico.</div>';
    return;
  }
  el.innerHTML = '';
  keys.forEach(key => {
    const d = devData[key];
    const vi = d.verseIdx !== undefined ? d.verseIdx : 0;
    const verse = VERSES[vi] || VERSES[0];
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `
      <div class="history-item-date">📅 ${formatDate(key)}</div>
      <div class="history-item-verse">${verse.text.substring(0,80)}… — ${verse.ref}</div>
      ${d.ans1 ? `<div class="history-item-note">💭 ${d.ans1.substring(0,100)}${d.ans1.length>100?'…':''}</div>` : ''}
      ${d.done ? '<div class="history-done">✅ Devocional concluído</div>' : '<div style="font-size:10px;color:#555;margin-top:4px">⬜ Não concluído</div>'}
    `;
    el.appendChild(item);
  });
}

renderToday();
</script>
</body>
</html>
